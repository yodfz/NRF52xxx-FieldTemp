# Keep the MCUboot child small, while enabling the same SPI NOR driver used by
# the application to reach the W25Q64 secondary image slot.
CONFIG_FLASH=y
CONFIG_SPI=y
CONFIG_SPI_NRFX=y
CONFIG_SPI_NOR=y
CONFIG_FLASH_JESD216_API=y
CONFIG_GPIO=y

# Zephyr defaults SPI_NOR_FLASH_LAYOUT_PAGE_SIZE to the 64 KiB block size.
# MCUboot derives its per-slot sector map from that layout, so with the
# default it sees the 0x28000 external secondary slot as 3 sectors
# (64K + 64K + 32K).  The trailing 32 KiB "sector" is not a multiple of the
# driver's 64 KiB erase block, so the erase issued while invalidating the
# secondary slot is rejected with -EINVAL and silently ignored (the assert
# is compiled out): the slot keeps its image data and its trailer magic
# after an upgrade.  Nordic's own reference FOTA configs pin this to the
# W25Q64's real 4096-byte sector size; do the same here so both the header
# and trailer scrambles are aligned and actually execute.
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# The custom E104-BT5010A-TB hardware uses the internal 32.768 kHz RC
# oscillator.  The nRF52 DK board default selects an external LFXO, which
# leaves MCUboot waiting in sys_clock_driver_init() before main() is reached.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

CONFIG_LOG=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_BOOT_BANNER=n
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_BOOT_MAX_IMG_SECTORS=128
