# 基础功能
CONFIG_GPIO=y

# 控制台：发布态全部关闭，见文件末尾「Release 配置」段。
#
# 【调试态启用方法】把文件末尾 Release 段整体注释掉，改用 RTT + J-Link 抓日志：
#     CONFIG_CONSOLE=y
#     CONFIG_UART_CONSOLE=n
#     CONFIG_USE_SEGGER_RTT=y
#     CONFIG_RTT_CONSOLE=y
#     CONFIG_NCS_BOOT_BANNER=n
#     CONFIG_PRINTK=y
#
# 【重要】CONFIG_NCS_BOOT_BANNER 在 NCS 中默认 y，且会 select PRINTK + select EARLY_CONSOLE，
# 因此“只写 CONFIG_PRINTK=n”是无效的：Kconfig 会给出
#   "PRINTK was assigned the value 'n' but got the value 'y'"
# 警告并继续编译 printk。要真正关掉 printk，必须同时关闭 NCS_BOOT_BANNER。
# 当前 CONFIG_CONSOLE=n 时 printk 本就没有输出后端，这些字符串只是纯 ROM 浪费。
CONFIG_SERIAL=y

# I2C 配置 - AHT30 温湿度传感器
CONFIG_I2C=y
CONFIG_I2C_NRFX=y

# SPI 配置 - W25Q64 Flash存储器（SPI 实例由板级 overlay 通过 devicetree 启用）
CONFIG_SPI=y
CONFIG_SPI_NRFX=y

# UART 驱动（设备树 uart0 仍存在，仅控制台改为 RTT）
CONFIG_UART_ASYNC_API=n
CONFIG_UART_INTERRUPT_DRIVEN=y

# 日志配置：发布态关闭。RTT 仅在调试态启用（写法见文件开头说明）。
# 注意：CONFIG_LOG 在本文件只允许出现一次（Kconfig 取最后一次赋值，重复会让文档与实际不一致）。

# 内存优化
# 注意：CONFIG_MAIN_STACK_SIZE 集中在本文件末尾的「栈与内存」段统一定义，此处不再重复赋值。
CONFIG_IDLE_STACK_SIZE=128
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1280
CONFIG_ISR_STACK_SIZE=1024

# 禁用串口控制台 (大幅节省 RAM)
# CONFIG_SERIAL=n
# CONFIG_CONSOLE=n
# CONFIG_UART_CONSOLE=n

# 蓝牙栈内存优化 (BT_HCI_TX_STACK_SIZE 由 nRF 默认设为 1536，勿覆盖)
#
# 【1024 → 1280，2026-09-13】实测依据（build-ota3，CONFIG_INIT_STACKS）：
#   未跑 OTA：rx_thread_stack 峰值 936/1024，只剩 88 B
#   跑完 OTA：峰值 968/1024，只剩 **56 B** —— 远低于 128 B 安全线
# 为什么 GATT 回调这么吃栈：这些重操作**直接跑在 BT RX 上下文**里：
#   · 写 W25Q64 记录     · 保存续传状态到 NVS     · OTA 开始时整槽擦除
#   · OTA 结束时扫描整个镜像算 SHA-256（mbedtls 上下文 + hash[32] 都在栈上）
# 只加容量是「短期最小修复」：它消除爆栈，但**不解决"阻塞 BT RX"**。
# 【已落地 2026-09-13】擦除 / Flash 写入 / NVS / 整镜像 SHA-256 已全部移出 GATT 回调，
#   改为「回调只校验+拷贝+投递，系统工作队列执行」（ble_ota.c 异步重写）。
#   重写后实测峰值 648/1280（空闲 632 B），重活落在 sys_work_q_stack（968/1280，空闲 312 B）。
#
# 【1280 → 1024，2026-09-13】按 648 B 峰值回收 256 B。
#   **已复测通过（build-ota3，INIT_STACKS），1024 固化为发布配置：**
#   最坏路径全套跑完后读栈（MTU128 全量 / MTU65 回退 / 断连续传 / 错误 SHA /
#   超大与错误密钥拒绝 / 重复 START·CANCEL，全程未复位，故为累积峰值）：
#     rx_thread_stack  峰值 648/1024 → 空闲 **376 B**  ✅（验收线 256 B）
#     sys_work_q 936/1280 空闲 344   z_main 696/1024 空闲 328
#     z_interrupt 600/1024 空闲 424  mpsl 400/640 空闲 240（最紧张，仍 ≥128）
#   **不要降到 768**：按峰值 648 仅余 120 B，不合格（低于 128 B 门槛）。
#   若将来测得 rx 空闲 < 256 B，一律恢复 1280。
#   代价/收益：总 RAM 23,016 → 22,760 B（92.61%），物理余量 1,560 → 1,816 B。
CONFIG_BT_RX_STACK_SIZE=1024

# 时钟配置
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# 蓝牙配置
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="PandaTemp"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=32
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=0
CONFIG_BT_SMP=n
CONFIG_BT_BONDABLE=n
CONFIG_BT_BUF_ACL_RX_SIZE=132
CONFIG_BT_BUF_ACL_TX_SIZE=132
CONFIG_BT_BUF_ACL_TX_COUNT=4
CONFIG_BT_BUF_EVT_RX_COUNT=5
CONFIG_BT_L2CAP_TX_BUF_COUNT=4
CONFIG_BT_L2CAP_TX_MTU=128
CONFIG_BT_BUF_CMD_TX_SIZE=65
CONFIG_BT_GATT_CACHING=n
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
CONFIG_BT_ATT_PREPARE_COUNT=0

# 电源管理（nRF52 系列 52810/52832 等在 NCS 中均未选 HAS_PM，CONFIG_PM 依赖不满足，勿强制 =y）
# CONFIG_PM=y
# CONFIG_PM_DEVICE=y
#
# 【如何打开】
# 1) 换板子时：若新板子/SoC 在 NCS 中已选 HAS_PM（非 nRF52 或后续 NCS 若开放），在 prj.conf 取消上面两行注释即可。
# 2) 当前板子要打开：先确认依赖——CONFIG_PM 依赖 SYS_CLOCK_EXISTS 与 HAS_PM（SoC 提供低功耗钩子）。
#    - 在 build 目录执行：ninja menuconfig → Subsystems and OS → Power Management，查看依赖是否满足。
#    - 若 HAS_PM 未选：在板级 conf（如 boards/<板名>.conf）或 SoC 层添加 select HAS_PM（需改 NCS 板级/SoC 树）。
# 3) 仅要系统级低功耗（k_sleep 进低功耗）：只启用 CONFIG_PM=y；CONFIG_PM_DEVICE 可选。
# 4) 启用 CONFIG_PM_DEVICE 时：app.overlay 中已对 i2c0/adc/flash 删除 zephyr,pm-device-runtime-auto，可避免链接错误。

# DCDC 转换器（降低射频功耗约40%）
# 注意：nrf52dk_nrf52810.dts 已默认启用 DCDC (regulator-initial-mode = NRF5X_REG_MODE_DCDC)

# Flash 配置
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_SOC_FLASH_NRF=y
CONFIG_SPI_NOR=y
CONFIG_FLASH_JESD216_API=y
# 外置 SPI NOR 的“布局页/擦除块”粒度必须等于 W25Q64 的实际擦除块 = 4 KiB。
# Zephyr 默认 65536，会与 NVS 的 sector_size=4096 直接冲突：
#   nvs_mount() -> flash_get_page_info_by_offs() 得到 info.size=65536
#   校验 `fs->sector_size % info.size` = 4096 % 65536 = 4096 != 0 -> 返回 -EINVAL
# 后果：nvs_config_init() 失败、nvs_ready 恒为 0，时间基准/采样间隔/设备配置全部无法持久化。
# 实测证据（2026-09-11）：修前 nvs_ready=0x00，W25Q64 的 nvs_storage(0x28000) 首 64B 全 0xFF。
# 该布局在 ROM 中仅是 {pages_count, pages_size} 两个整数，不占 RAM。
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# NVS 配置（配置 + W25Q64 位置存芯片 FLASH，定时 flush）
CONFIG_NVS=y
# CONFIG_SETTINGS=y
# 注意：CONFIG_NVS_LOG_LEVEL 由 Zephyr 日志子系统间接提供，不可在 prj.conf 中直接设置；
# 且当前 CONFIG_LOG=n，NVS 日志已随全局日志关闭。
# NVS 写内部 Flash 时需允许 MPU 写，否则可能 MPU FAULT
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# ===== Release 配置：关闭全部控制台/日志输出（省 ROM/RAM）=====
#
# 维护须知：Kconfig 对同一符号取“最后一次赋值”，在同一文件里重复赋值只会产生警告，
# 并让文档与实际 .config 不一致（本项目历史上就发生过：文档写 PRINTK=n，实际 CONFIG_PRINTK=y）。
# 因此每个符号在 prj.conf 中只出现一次，调试开关统一走文件开头的说明。
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_CONSOLE=n
# PRINTK 被强制为 y 的真正原因：NCS_BOOT_BANNER 默认 y 且 select PRINTK + EARLY_CONSOLE
CONFIG_NCS_BOOT_BANNER=n
CONFIG_EARLY_CONSOLE=n

CONFIG_USE_SEGGER_RTT=n
CONFIG_RTT_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=n

CONFIG_BOOT_BANNER=n

# 512 → 640（2026-09-13）：实测峰值 400/512，余 112 B，是全项目余量最小的栈。
# MPSL 是协议栈的低优先级工作上下文，余量必须留够，不能拿它去换别的 RAM。
CONFIG_MPSL_WORK_STACK_SIZE=640

# ===== 栈与内存：CONFIG_MAIN_STACK_SIZE 全工程唯一赋值点 =====
# 实测（tools/stack_hwm.py，2026-09-11）：
#   768 B 时 z_main_stack 峰值 680 B，仅余 88 B（88.5%）——全项目最紧张的一个栈。
#   v3（采样/历史周期解耦）在采样路径上又增加了聚合与事件判定逻辑，故上调到 1024 B，
#   把余量拉回安全区；RAM 代价 +256 B。
CONFIG_MAIN_STACK_SIZE=1024

# ==========================================================================
# OTA（自定义极简 BLE OTA：Control / Data / Status）
# ==========================================================================
# 镜像写入：flash_img + stream_flash。缓冲就是 CONFIG_IMG_BLOCK_BUF_SIZE，
# 没有隐藏的大结构（struct flash_img_context = buf[N] + flash_area* + stream_flash_ctx≈48B）。
# 取 256 = W25Q64 的页大小，正好一次页编程写满，不浪费。
# 注意：IMG_MANAGER **depends on** STREAM_FLASH（是 depends 不是 select），
# 不显式打开的话 Kconfig 会静默丢弃 IMG_MANAGER，表现为
# "CONFIG_IMG_BLOCK_BUF_SIZE undeclared" 这种看起来毫不相干的编译错误。
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_BLOCK_BUF_SIZE=256

# App 侧 SHA-256 校验（flash_img_check）。会拉进 SHA-256 实现，
# 若体积超标可关掉——完整性最终由 MCUboot 的 ECDSA-P256 验签兜底。
CONFIG_IMG_ENABLE_IMAGE_CHECK=y

# sys_reboot() 需要显式打开，否则链接期才报 "undefined reference to sys_reboot"
CONFIG_REBOOT=y

# ATT MTU：请求 128，协商失败自动回退到默认（不是升级前提）。
# 代价是 ACL 缓冲从 69 加到 132（MTU+4），RAM 约 +0.4 KB。
# CONFIG_BT_L2CAP_TX_MTU / *_BUF_ACL_*_SIZE 在上面的蓝牙段统一定义，此处不再重复。

# ==========================================================================
# 电池电压（SAADC 内部 VDD 通道，零外部电路 —— 见 app.overlay 的 &adc）
# ==========================================================================
# 板子**没有**电压采样/分压电路；nRF52810 的 SAADC 能直接测 VDD，前提是
# VCC 直接由电池供电（无 LDO），否则读到的是稳压值而不是电池电压。
#
# 实测成本（隔离探针 build-vddprobe，对比 build-ota3）：
#   ROM +4,432 B（签名镜像 145,590 → 150,023，距红线仍有 7,673 B）
#   RAM +192 B （22,760 → 22,952，物理余量 1,816 → 1,624 B）
# 其中我们自己的代码只有 120 B（vdd_sample_mv），其余全是 Zephyr ADC 子系统
# + nrfx SAADC 驱动（adc_nrfx_read/SAADC_IRQHandler/nrfx_saadc_* 等）。
# 注意：**必须真有 adc_read() 调用点**才量得准 —— 只开 CONFIG_ADC 而不调用，
# --gc-sections 会把整个驱动回收，量出来是 ~0（与 IMG_MANAGER 探针同一个坑）。
#
# 功耗：驱动在每次转换 DONE 后 nrfy_saadc_disable()，空闲不耗电；
# 默认每 60 秒采一次（见 src/vdd.h 的 VDD_SAMPLE_PERIOD_S，钳位 60~300）。
CONFIG_ADC=y
